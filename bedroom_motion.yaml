# Bedroom Motion — NodeMCU ESP8266 (ESP-12E) + HLK-LD2410C 24GHz mmWave presence radar
#
# Wiring (LD2410C pad -> NodeMCU pin):
#   VCC -> VU   (USB 5V rail; sensor needs 5V, do NOT use 3V3)
#   GND -> G
#   TX  -> RX   (GPIO3, ESP RX)    \ hardware UART0 — software serial is not
#   RX  -> TX   (GPIO1, ESP TX)    / reliable at 256000 baud
#   OUT -> D1   (GPIO5)            optional hardware presence output
#
# NOTE: D8/GPIO15 was tried for ESP TX but the LD2410's RX pin holds it HIGH at
# boot, which forces the ESP into SDIO boot mode (boot mode:(7,x)) — it never
# starts. GPIO1/3 have no strapping role but are shared with the USB-serial chip:
#   * serial logging is disabled (baud_rate: 0) — use `esphome logs` over WiFi
#   * unplug the sensor TX wire (NodeMCU RX) when flashing over USB; use OTA after

substitutions:
  device_name: "Bedroom Motion"
  friendly_name: "Bedroom Motion"
  uart_tx_pin: GPIO1    # TX -> LD2410 RX
  uart_rx_pin: GPIO3    # RX <- LD2410 TX
  out_pin: GPIO5        # D1 <- LD2410 OUT

esphome:
  name: bedroom-motion
  friendly_name: "${friendly_name}"

esp8266:
  board: nodemcuv2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  baud_rate: 0

uart:
  id: uart_ld2410
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: radar
  uart_id: uart_ld2410

binary_sensor:
  - platform: ld2410
    ld2410_id: radar
    has_target:
      name: "Presence"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

  # Radar's own digital OUT pin — independent of UART, useful as a sanity check
  - platform: gpio
    pin: ${out_pin}
    name: "Presence (OUT pin)"
    device_class: occupancy

sensor:
  - platform: ld2410
    ld2410_id: radar
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    moving_energy:
      name: "Moving Energy"
    still_energy:
      name: "Still Energy"
    detection_distance:
      name: "Detection Distance"

# Tunable from Home Assistant (stored in the radar's own flash)
number:
  - platform: ld2410
    ld2410_id: radar
    timeout:
      name: "Presence Timeout"
    max_move_distance_gate:
      name: "Max Move Distance Gate"
    max_still_distance_gate:
      name: "Max Still Distance Gate"

# Radar's built-in BLE — only needed for phone-app setup/calibration. Disabled
# to drop the always-on RF radio and its open reconfiguration surface.
# switch:
#   - platform: ld2410
#     ld2410_id: radar
#     bluetooth:
#       name: "Radar Bluetooth"

button:
  - platform: ld2410
    ld2410_id: radar
    restart:
      name: "Radar Restart"

text_sensor:
  - platform: ld2410
    ld2410_id: radar
    version:
      name: "Radar Firmware"

time:
  - platform: homeassistant
    id: homeassistant_time
