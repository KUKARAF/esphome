substitutions:
  name: "m5dial"
  friendly_name: "M5Dial"
  screensaver: "5min"
  # ──── Lights ────────────────────────────────────────────────────────────────
  # Set num_lights to match the number of light slots below (max: add more blocks).
  # To add a light: add substitutions, a brN global, a sensor block, and an if-block
  # in the get_current_light script.
  num_lights: "4"
  light0_entity: "light.bathroom_nightlight_bathroom_nightlight"
  light0_name:   "Bathroom"
  light1_entity: "light.kitchen_lights_small_lights"
  light1_name:   "Kitchen Small"
  light2_entity: "light.kitchen_lights_big_lights"
  light2_name:   "Kitchen Big"
  light3_entity: "light.desk_light_desk_light"
  light3_name:   "Desk"
  # ──── Action items ──────────────────────────────────────────────────────────
  # num_items = num_lights + number of action slots (egg timer + find phone + cleaning + settings = 4)
  num_items: "8"
  phone_ring_entity: "button.fmd_rafa_volume_ring_device"
  # ──── Cleaning (Juanita) ────────────────────────────────────────────────────
  # Calls vacuum.juanita (Roborock) directly — vacuum.start for the whole flat,
  # vacuum.send_command (app_segment_clean) with a hardcoded segment id per room.
  # Segment ids come from `roborock.get_maps` on vacuum.juanita and only change
  # if the flat is remapped.
  vacuum_entity: "vacuum.juanita"
  num_clean_rooms: "7"
  clean_room0_name: "Corridor"
  clean_room0_id: "16"
  clean_room1_name: "Bathroom"
  clean_room1_id: "17"
  clean_room2_name: "Bedroom"
  clean_room2_id: "19"
  clean_room3_name: "Rafas office"
  clean_room3_id: "18"
  clean_room4_name: "Carpet"
  clean_room4_id: "22"
  clean_room5_name: "Kitchen"
  clean_room5_id: "24"
  clean_room6_name: "Jadalnia"
  clean_room6_id: "23"
  # ──── Controller presence (BLE) ─────────────────────────────────────────────
  # HA watches these binary sensors and fires the bazzite Wake-on-LAN automation.
  xbox_controller_mac: "68:6C:E6:7A:DE:F4"
  steam_controller_mac: "EE:DD:40:6E:76:FC"
  # ────────────────────────────────────────────────────────────────────────────
  sdapin: GPIO11
  sclpin: GPIO12
  tres: GPIO8
  dcpin: GPIO4
  bkpin: GPIO9
  clpin: GPIO6
  mopin: GPIO5
  cspin: GPIO7
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - m5dial_anim.h
  on_boot:
    priority: -100
    then:
      - script.execute: get_current_light
      - script.execute: screentime
      - script.execute: update_display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_password

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

# Passive scan: just listen for the controllers' advertisements, never respond
# (active: false avoids answering scan requests / interfering with pairing).
esp32_ble_tracker:
  scan_parameters:
    active: false

i2c:
  - id: bus_internal
    sda: ${sdapin}
    scl: ${sclpin}
    scan: false

spi:
  mosi_pin: ${mopin}
  clk_pin: ${clpin}

display:
  - platform: ili9xxx
    model: GC9A01A
    id: watchface
    cs_pin: ${cspin}
    dc_pin: ${dcpin}
    reset_pin: ${tres}
    invert_colors: true
    rotation: 0
    dimensions:
      width: 240
      height: 240

touchscreen:
  - platform: ft5x06
    id: ts
    i2c_id: bus_internal
    address: 0x38
    on_touch:
      then:
        - lambda: |-
            if (id(canary_visible)) {
              id(dismiss_canary).execute();
              return;
            }
            if (id(sel) == ${num_lights}) {
              id(timer_beep).execute();
            } else if (id(dim_mode) && id(sel) < ${num_lights}) {
              id(toggle_light).execute();
            }

output:
  - id: oledbacklight
    platform: ledc
    pin: ${bkpin}
    max_power: 1
    min_power: 0.1
  - id: buzzer
    platform: ledc
    pin: GPIO3

rtttl:
  output: buzzer

light:
  - platform: monochromatic
    output: oledbacklight
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms

globals:
  - id: sel
    type: int
    restore_value: no
    initial_value: '0'
  - id: dim_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: current_entity
    type: std::string
    restore_value: no
    initial_value: '"${light0_entity}"'
  - id: current_name
    type: std::string
    restore_value: no
    initial_value: '"${light0_name}"'
  - id: current_icon
    type: std::string
    restore_value: no
    initial_value: '"\U000F09AB"'
  - id: current_brightness
    type: int
    restore_value: no
    initial_value: '0'
  # Per-light cached brightness (0–255; 0 = off)
  - id: br0
    type: int
    restore_value: no
    initial_value: '0'
  - id: br1
    type: int
    restore_value: no
    initial_value: '0'
  - id: br2
    type: int
    restore_value: no
    initial_value: '0'
  - id: br3
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_encoder_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: timer_running
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: timer_remaining
    type: int
    restore_value: no
    initial_value: '0'
  - id: blink_entity
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: blink_brightness
    type: int
    restore_value: no
    initial_value: '0'
  - id: canary_visible
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: air_co2
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: air_hcho
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: in_cleaning_menu
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: in_settings
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: clean_sel
    type: int
    restore_value: no
    initial_value: '0'
  - id: current_clean_display
    type: std::string
    restore_value: no
    initial_value: '"Whole Flat"'
  - id: current_clean_icon
    type: std::string
    restore_value: no
    initial_value: '"\U000F104D"'

font:
  - file: "gfonts://Roboto"
    id: roboto_18
    size: 18
    glyphsets: [GF_Latin_Kernel]
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_80
    size: 80
    glyphs:
      - "\U000F09AB"  # mdi:toilet      → Bathroom
      - "\U000F1B29"  # mdi:faucet      → Kitchen Small
      - "\U000F065A"  # mdi:pot-steam   → Kitchen Big
      - "\U000F0E51"  # mdi:monitor     → Desk
      - "\U000F0AAF"  # mdi:egg          → Egg Timer
      - "\U000F03F2"  # mdi:phone       → Find Phone
      - "\U000F15C6"  # mdi:bird        → Canary alive
      - "\U000F0C6E"  # mdi:emoticon-dead → Canary dead
      - "\U000F00E2"  # mdi:broom               → Cleaning (main menu)
      - "\U000F104D"  # mdi:home-circle-outline → Whole Flat
      - "\U000F0CDD"  # mdi:arrow-left-circle   → Back
      - "\U000F0B47"  # mdi:shoe-formal         → Corridor
      - "\U000F08A0"  # mdi:bed-empty           → Bedroom
      - "\U000F0AAB"  # mdi:desktop-tower-monitor → Rafas office
      - "\U000F1475"  # mdi:rug                 → Carpet
      - "\U000F028F"  # mdi:fridge-outline      → Kitchen
      - "\U000F1061"  # mdi:table-chair         → Jadalnia
      - "\U000F0493"  # mdi:cog                 → Settings
      - "\U000F05A9"  # mdi:wifi                → WiFi info
  - file: "gfonts://Roboto"
    id: roboto_dots
    size: 10
    glyphs: "● ○"

# ──── HA brightness sensors ─────────────────────────────────────────────────
# brightness attribute is 0-255; NaN when the light is off (stored as 0).
# Duplicate this block for each additional light — keep entity_id, id, global
# and the get_current_light if-block in sync.
sensor:
  - platform: homeassistant
    entity_id: ${light0_entity}
    attribute: brightness
    id: ha_br0
    on_value:
      then:
        - globals.set:
            id: br0
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int)x;
        - if:
            condition: {lambda: return id(sel) == 0;}
            then:
              - globals.set:
                  id: current_brightness
                  value: !lambda |-
                    if (std::isnan(x)) return 0;
                    return (int)x;
              - script.execute: update_display

  - platform: homeassistant
    entity_id: ${light1_entity}
    attribute: brightness
    id: ha_br1
    on_value:
      then:
        - globals.set:
            id: br1
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int)x;
        - if:
            condition: {lambda: return id(sel) == 1;}
            then:
              - globals.set:
                  id: current_brightness
                  value: !lambda |-
                    if (std::isnan(x)) return 0;
                    return (int)x;
              - script.execute: update_display

  - platform: homeassistant
    entity_id: ${light2_entity}
    attribute: brightness
    id: ha_br2
    on_value:
      then:
        - globals.set:
            id: br2
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int)x;
        - if:
            condition: {lambda: return id(sel) == 2;}
            then:
              - globals.set:
                  id: current_brightness
                  value: !lambda |-
                    if (std::isnan(x)) return 0;
                    return (int)x;
              - script.execute: update_display

  - platform: homeassistant
    entity_id: ${light3_entity}
    attribute: brightness
    id: ha_br3
    on_value:
      then:
        - globals.set:
            id: br3
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int)x;
        - if:
            condition: {lambda: return id(sel) == 3;}
            then:
              - globals.set:
                  id: current_brightness
                  value: !lambda |-
                    if (std::isnan(x)) return 0;
                    return (int)x;
              - script.execute: update_display

  - platform: homeassistant
    entity_id: sensor.mt15_mt29_carbon_dioxide
    id: ha_co2
    on_value:
      then:
        - globals.set:
            id: air_co2
            value: !lambda return x;
        - if:
            condition: {lambda: return id(canary_visible);}
            then:
              - script.execute: update_canary_display

  - platform: homeassistant
    entity_id: sensor.mt15_mt29_formaldehyde
    id: ha_hcho
    on_value:
      then:
        - globals.set:
            id: air_hcho
            value: !lambda return x;
        - if:
            condition: {lambda: return id(canary_visible);}
            then:
              - script.execute: update_canary_display

  - platform: rotary_encoder
    name: "Rotary Encoder"
    id: rotaryencoder
    pin_a:
      number: GPIO40
      mode: {input: true, pullup: true}
    pin_b:
      number: GPIO41
      mode: {input: true, pullup: true}
    resolution: 1
    on_clockwise:
      then:
        - lambda: |-
            if (id(canary_visible)) {
              id(dismiss_canary).execute();
              return;
            }
            if ((millis() - id(last_encoder_ms)) < 80) return;
            id(last_encoder_ms) = millis();
            id(screentime).execute();
            if (id(in_settings)) return;
            if (id(in_cleaning_menu)) {
              id(clean_sel) = (id(clean_sel) + 1) % (${num_clean_rooms} + 2);
              id(get_current_clean_room).execute();
              id(update_cleaning_display).execute();
              return;
            }
            if (!id(dim_mode) || id(sel) >= ${num_lights}) {
              if (id(sel) < ${num_lights}) id(restore_blink_light).execute();
              id(sel) = (id(sel) + 1) % ${num_items};
              id(get_current_light).execute();
              id(update_display).execute();
              if (id(sel) < ${num_lights}) id(select_blink).execute();
            } else {
              id(brightness_up).execute();
            }
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(canary_visible)) {
              id(dismiss_canary).execute();
              return;
            }
            if ((millis() - id(last_encoder_ms)) < 80) return;
            id(last_encoder_ms) = millis();
            id(screentime).execute();
            if (id(in_settings)) return;
            if (id(in_cleaning_menu)) {
              id(clean_sel) = (id(clean_sel) + (${num_clean_rooms} + 2) - 1) % (${num_clean_rooms} + 2);
              id(get_current_clean_room).execute();
              id(update_cleaning_display).execute();
              return;
            }
            if (!id(dim_mode) || id(sel) >= ${num_lights}) {
              if (id(sel) < ${num_lights}) id(restore_blink_light).execute();
              id(sel) = (id(sel) + ${num_items} - 1) % ${num_items};
              id(get_current_light).execute();
              id(update_display).execute();
              if (id(sel) < ${num_lights}) id(select_blink).execute();
            } else {
              id(brightness_down).execute();
            }

binary_sensor:
  # On while the controller is advertising, off after `timeout` of silence.
  # Controllers advertise in bursts with gaps, so hold "on" for 2 min after the
  # last sighting; HA then only sees one off->on per real arrival.
  - platform: ble_presence
    mac_address: ${xbox_controller_mac}
    name: "Xbox Controller Nearby"
    timeout: 15s
    filters:
      - delayed_off: 2min

  - platform: ble_presence
    mac_address: ${steam_controller_mac}
    name: "Steam Controller Nearby"
    timeout: 15s
    filters:
      - delayed_off: 2min

  - platform: gpio
    pin:
      number: GPIO42
      mode: {input: true, pullup: true}
      inverted: true
    id: dial_button
    filters:
      - delayed_on: 10ms
    on_multi_click:
      - timing:
          - ON for 50ms to 500ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              if (id(canary_visible)) {
                id(dismiss_canary).execute();
                return;
              }
              id(screentime).execute();
              if (id(in_settings)) {
                id(exit_settings).execute();
                return;
              }
              if (id(in_cleaning_menu)) {
                if (id(clean_sel) == ${num_clean_rooms} + 1) {
                  id(exit_cleaning_menu).execute();
                } else {
                  id(start_clean).execute();
                }
                return;
              }
              if (id(sel) < ${num_lights}) {
                if (!id(dim_mode)) {
                  id(restore_blink_light).execute();
                  id(blink_entity) = std::string("");
                }
                id(dim_mode) = !id(dim_mode);
                id(update_display).execute();
              } else if (id(sel) == ${num_lights}) {
                id(start_egg_timer).execute();
              } else if (id(sel) == ${num_lights} + 1) {
                id(ring_phone).execute();
              } else if (id(sel) == ${num_lights} + 2) {
                id(enter_cleaning_menu).execute();
              } else {
                id(enter_settings).execute();
              }
      - timing:
          - ON for at least 700ms
        then:
          - lambda: |-
              if (id(canary_visible)) {
                id(dismiss_canary).execute();
                return;
              }
              id(screentime).execute();
              if (id(sel) < ${num_lights}) {
                id(toggle_light).execute();
              }

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(timer_running)) return;
          id(timer_remaining) = id(timer_remaining) - 1;
          if (id(timer_remaining) <= 0) {
            id(timer_running) = false;
            id(timer_remaining) = 0;
            id(timer_beep).execute();
          }
          if (id(sel) == ${num_lights}) {
            id(update_display).execute();
          }

script:
  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - if:
          condition: {lambda: return id(in_cleaning_menu);}
          then:
            - lvgl.page.show: cleaning_page
          else:
            - if:
                condition: {lambda: return id(in_settings);}
                then:
                  - lvgl.page.show: settings_page
                else:
                  - lvgl.page.show: main_page
      - delay: ${screensaver}
      - script.execute: show_canary

  - id: show_canary
    mode: single
    then:
      - globals.set:
          id: canary_visible
          value: 'true'
      - script.execute: update_canary_display
      - lvgl.page.show: canary_page

  - id: dismiss_canary
    mode: single
    then:
      - globals.set:
          id: canary_visible
          value: 'false'
      - globals.set:
          id: in_cleaning_menu
          value: 'false'
      - lvgl.page.show: main_page
      - script.execute: update_display
      - script.execute: screentime

  - id: update_canary_display
    mode: single
    then:
      - lambda: |-
          bool co2_high = id(air_co2) >= 1500.0f;
          bool hcho_high = id(air_hcho) >= 0.3f;
          bool bad = co2_high || hcho_high;
          lv_obj_set_style_bg_color(id(canary_bg),
            bad ? lv_color_hex(0x550000) : lv_color_hex(0x1A3300), LV_PART_MAIN);
          lv_label_set_text(id(canary_icon_lbl),
            bad ? "\U000F0C6E" : "\U000F15C6");
          lv_obj_set_style_text_color(id(canary_icon_lbl),
            bad ? lv_color_hex(0xFF3333) : lv_color_hex(0xFFDD00), LV_PART_MAIN);
          lv_label_set_text(id(canary_status_lbl),
            bad ? "Bad Air!" : "Air OK");
          lv_obj_set_style_text_color(id(canary_status_lbl),
            bad ? lv_color_hex(0xFF8888) : lv_color_hex(0x88FF88), LV_PART_MAIN);
          std::string reason;
          if (co2_high && hcho_high) {
            reason = "CO2 & HCHO high";
          } else if (co2_high) {
            reason = "CO2 high";
          } else if (hcho_high) {
            reason = "HCHO high";
          }
          lv_label_set_text(id(canary_reason_lbl), reason.c_str());
          lv_obj_invalidate(id(canary_bg));

  # Updates current_entity, current_name, current_brightness from sel.
  # Add one if-block here for each additional light.
  - id: get_current_light
    mode: single
    then:
      - if:
          condition: {lambda: return id(sel) == 0;}
          then:
            - globals.set:
                id: current_entity
                value: !lambda return "${light0_entity}";
            - globals.set:
                id: current_name
                value: !lambda return "${light0_name}";
            - globals.set:
                id: current_icon
                value: !lambda return "\U000F09AB";  # toilet
            - globals.set:
                id: current_brightness
                value: !lambda return id(br0);
      - if:
          condition: {lambda: return id(sel) == 1;}
          then:
            - globals.set:
                id: current_entity
                value: !lambda return "${light1_entity}";
            - globals.set:
                id: current_name
                value: !lambda return "${light1_name}";
            - globals.set:
                id: current_icon
                value: !lambda return "\U000F1B29";  # faucet
            - globals.set:
                id: current_brightness
                value: !lambda return id(br1);
      - if:
          condition: {lambda: return id(sel) == 2;}
          then:
            - globals.set:
                id: current_entity
                value: !lambda return "${light2_entity}";
            - globals.set:
                id: current_name
                value: !lambda return "${light2_name}";
            - globals.set:
                id: current_icon
                value: !lambda return "\U000F065A";  # pot-steam
            - globals.set:
                id: current_brightness
                value: !lambda return id(br2);
      - if:
          condition: {lambda: return id(sel) == 3;}
          then:
            - globals.set:
                id: current_entity
                value: !lambda return "${light3_entity}";
            - globals.set:
                id: current_name
                value: !lambda return "${light3_name}";
            - globals.set:
                id: current_icon
                value: !lambda return "\U000F0E51";  # monitor
            - globals.set:
                id: current_brightness
                value: !lambda return id(br3);
      - if:
          condition:
            lambda: return id(sel) == ${num_lights};
          then:
            - globals.set:
                id: current_entity
                value: !lambda return std::string("");
            - globals.set:
                id: current_name
                value: !lambda return std::string("Egg Timer");
            - globals.set:
                id: current_icon
                value: !lambda return std::string("\U000F0AAF");
            - globals.set:
                id: current_brightness
                value: !lambda return 0;
      - if:
          condition:
            lambda: return id(sel) == ${num_lights} + 1;
          then:
            - globals.set:
                id: current_entity
                value: !lambda return std::string("");
            - globals.set:
                id: current_name
                value: !lambda return std::string("Find Phone");
            - globals.set:
                id: current_icon
                value: !lambda return std::string("\U000F03F2");
            - globals.set:
                id: current_brightness
                value: !lambda return 0;
      - if:
          condition:
            lambda: return id(sel) == ${num_lights} + 2;
          then:
            - globals.set:
                id: current_entity
                value: !lambda return std::string("");
            - globals.set:
                id: current_name
                value: !lambda return std::string("Cleaning");
            - globals.set:
                id: current_icon
                value: !lambda return std::string("\U000F00E2");
            - globals.set:
                id: current_brightness
                value: !lambda return 0;
      - if:
          condition:
            lambda: return id(sel) == ${num_lights} + 3;
          then:
            - globals.set:
                id: current_entity
                value: !lambda return std::string("");
            - globals.set:
                id: current_name
                value: !lambda return std::string("Settings");
            - globals.set:
                id: current_icon
                value: !lambda return std::string("\U000F0493");
            - globals.set:
                id: current_brightness
                value: !lambda return 0;

  # Updates current_clean_display, current_clean_icon from clean_sel.
  # 0 = Whole Flat, 1..num_clean_rooms = individual rooms, last slot = Back.
  - id: get_current_clean_room
    mode: single
    then:
      - if:
          condition:
            lambda: return id(clean_sel) == 0;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return std::string("Whole Flat");
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F104D");
      - if:
          condition:
            lambda: return id(clean_sel) == 1;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room0_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F0B47");
      - if:
          condition:
            lambda: return id(clean_sel) == 2;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room1_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F09AB");
      - if:
          condition:
            lambda: return id(clean_sel) == 3;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room2_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F08A0");
      - if:
          condition:
            lambda: return id(clean_sel) == 4;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room3_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F0AAB");
      - if:
          condition:
            lambda: return id(clean_sel) == 5;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room4_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F1475");
      - if:
          condition:
            lambda: return id(clean_sel) == 6;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room5_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F028F");
      - if:
          condition:
            lambda: return id(clean_sel) == 7;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room6_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F1061");
      - if:
          condition:
            lambda: return id(clean_sel) == ${num_clean_rooms} + 1;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return std::string("Back");
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F0CDD");

  - id: update_cleaning_display
    mode: single
    then:
      - lvgl.label.update:
          id: clean_icon_lbl
          text: !lambda return id(current_clean_icon);
      - lvgl.label.update:
          id: clean_name_lbl
          text: !lambda return id(current_clean_display);
      - lvgl.label.update:
          id: clean_dots_lbl
          text: !lambda |-
            std::string s;
            int total = ${num_clean_rooms} + 2;
            for (int i = 0; i < total; i++) {
              if (i > 0) s += " ";
              s += (i == id(clean_sel)) ? "●" : "○";
            }
            return s;

  - id: enter_cleaning_menu
    mode: single
    then:
      - globals.set: {id: in_cleaning_menu, value: 'true'}
      - globals.set: {id: clean_sel, value: '0'}
      - script.execute: get_current_clean_room
      - script.execute: update_cleaning_display
      - lvgl.page.show: cleaning_page

  - id: exit_cleaning_menu
    mode: single
    then:
      - globals.set: {id: in_cleaning_menu, value: 'false'}
      - lvgl.page.show: main_page
      - script.execute: update_display

  # Settings: single option (WiFi) showing the connected SSID and this device's IP.
  - id: enter_settings
    mode: single
    then:
      - globals.set: {id: in_settings, value: 'true'}
      - lvgl.label.update:
          id: wifi_ssid_lbl
          text: !lambda |-
            std::string s = id(wifi_ssid_txt).state;
            return s.empty() ? std::string("Not connected") : s;
      - lvgl.label.update:
          id: wifi_ip_lbl
          text: !lambda |-
            std::string s = id(wifi_ip_txt).state;
            return s.empty() ? std::string("—") : s;
      - lvgl.page.show: settings_page

  - id: exit_settings
    mode: single
    then:
      - globals.set: {id: in_settings, value: 'false'}
      - lvgl.page.show: main_page
      - script.execute: update_display

  # Calls vacuum.juanita directly (no HA automation involved), mirroring how
  # lights are toggled. clean_sel 0 = whole flat; 1..num_clean_rooms = a single
  # room, cleaned via a hardcoded Roborock segment id.
  - id: start_clean
    mode: single
    then:
      - if:
          condition:
            lambda: return id(clean_sel) == 0;
          then:
            - homeassistant.action:
                action: vacuum.start
                data:
                  entity_id: "${vacuum_entity}"
      - if:
          condition:
            lambda: return id(clean_sel) == 1;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room0_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 2;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room1_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 3;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room2_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 4;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room3_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 5;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room4_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 6;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room5_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 7;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room6_id}], 'repeat': 1}] }}"

  - id: update_display
    mode: single
    then:
      # SELECT: colored bg + white icon. DIM: gray bg (brightness) + room-colored icon.
      - lambda: |-
          lv_color_t target;
          if (!id(dim_mode) || id(sel) >= ${num_lights}) {
            static const uint32_t c[] = {0x005599, 0xAA4400, 0xAA7700, 0x005533, 0x885500, 0x006644, 0x555555, 0x333366};
            target = lv_color_hex(c[id(sel)]);
          } else {
            uint8_t v = (uint8_t)id(current_brightness);
            target = lv_color_make(v, v, v);
          }
          m5dial_animate_bg(id(bg), target, 300);
      - lvgl.label.update:
          id: lbl_icon
          text: !lambda return id(current_icon);
          text_color: !lambda |-
            if (!id(dim_mode) || id(sel) >= ${num_lights}) return lv_color_hex(0xFFFFFF);
            static const uint32_t c[] = {0x005599, 0xAA4400, 0xAA7700, 0x005533, 0x885500, 0x006644, 0x555555, 0x333366};
            return lv_color_hex(c[id(sel)]);
      # Dot row: white in SELECT, room color in DIM
      - lvgl.label.update:
          id: lbl_dots
          text: !lambda |-
            std::string s;
            for (int i = 0; i < ${num_items}; i++) {
              if (i > 0) s += " ";
              s += (i == id(sel)) ? "●" : "○";
            }
            return s;
          text_color: !lambda |-
            if (!id(dim_mode) || id(sel) >= ${num_lights}) return lv_color_hex(0xFFFFFF);
            static const uint32_t c[] = {0x005599, 0xAA4400, 0xAA7700, 0x005533, 0x885500, 0x006644, 0x555555, 0x333366};
            return lv_color_hex(c[id(sel)]);
      - lvgl.label.update:
          id: lbl_timer
          text: !lambda |-
            if (id(sel) == ${num_lights} && id(timer_running)) {
              int t = id(timer_remaining);
              char buf[8];
              snprintf(buf, sizeof(buf), "%d:%02d", t / 60, t % 60);
              return std::string(buf);
            }
            return std::string("");

  # Rotating up when light is off turns it on at default/last brightness.
  - id: brightness_up
    mode: queued
    then:
      - if:
          condition:
            lambda: return (id(current_brightness) * 100 / 255) + 10 > 100;
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda return id(current_entity);
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(current_entity);
                  brightness_pct: !lambda |-
                    return std::to_string((id(current_brightness) * 100 / 255) + 10);

  - id: brightness_down
    mode: queued
    then:
      - if:
          condition:
            lambda: return (id(current_brightness) * 100 / 255) - 10 < 1;
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(current_entity);
                  brightness_pct: "100"
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(current_entity);
                  brightness_pct: !lambda |-
                    return std::to_string((id(current_brightness) * 100 / 255) - 10);

  - id: select_blink
    mode: restart
    then:
      - globals.set:
          id: blink_entity
          value: !lambda return id(current_entity);
      - globals.set:
          id: blink_brightness
          value: !lambda return id(current_brightness);
      - repeat:
          count: 4
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(blink_entity);
                  brightness_pct: "70"
                  transition: "1.0"
            - delay: 1200ms
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(blink_entity);
                  brightness_pct: "20"
                  transition: "1.0"
            - delay: 1200ms
      - if:
          condition:
            lambda: return id(blink_brightness) == 0;
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda return id(blink_entity);
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(blink_entity);
                  brightness_pct: !lambda |-
                    int pct = id(blink_brightness) * 100 / 255;
                    return std::to_string(pct < 1 ? 1 : pct);
                  transition: "1.0"

  - id: restore_blink_light
    mode: single
    then:
      - script.stop: select_blink
      - if:
          condition:
            lambda: return !id(blink_entity).empty();
          then:
            - if:
                condition:
                  lambda: return id(blink_brightness) == 0;
                then:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: !lambda return id(blink_entity);
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda return id(blink_entity);
                        brightness_pct: !lambda |-
                          int pct = id(blink_brightness) * 100 / 255;
                          return std::to_string(pct < 1 ? 1 : pct);

  - id: toggle_light
    mode: single
    then:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: !lambda return id(current_entity);

  # Short press on egg timer slot starts/restarts the countdown.
  - id: start_egg_timer
    mode: restart
    then:
      - globals.set:
          id: timer_running
          value: 'true'
      - globals.set:
          id: timer_remaining
          value: '395'  # 6 min 35 sec
      - script.execute: update_display

  - id: ring_phone
    mode: single
    then:
      - homeassistant.action:
          action: button.press
          data:
            entity_id: "${phone_ring_entity}"

  - id: timer_beep
    mode: single
    then:
      - rtttl.play: "HarryPot:d=8,o=6,b=125:b5,e.,16g,f#,4e,b,4a.,4f#.,e.,16g,f#,4d,f,2b5,p,b5,e.,16g,f#,4e,b,4d7,c#7,4c7,g#,c.7,16b,a#,4f#,g,2e,p,g,4b,g,4b,g,4c7,b,4a#,f#,g.,16b,a#,4a#5,b5,2b"

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_txt
      internal: true
    ip_address:
      id: wifi_ip_txt
      internal: true

text:
  - platform: template
    name: "RTTTL Song"
    id: rtttl_song
    mode: text
    optimistic: true
    initial_value: ""

button:
  - platform: template
    name: "Play RTTTL"
    on_press:
      then:
        - rtttl.play: !lambda 'return id(rtttl_song).state;'

lvgl:
  buffer_size: 50%
  displays:
    - watchface
  theme:
    label:
      text_color: 0xFFFFFF
  pages:
    - id: main_page
      bg_color: 0x000000
      widgets:
        # Full-screen background — color drives both SELECT (room colour) and DIM (brightness)
        - obj:
            id: bg
            width: 240
            height: 240
            align: CENTER
            bg_color: 0x005599
            border_width: 0
            radius: 0
            pad_all: 0
        # Large room icon centred on screen
        - label:
            id: lbl_icon
            align: CENTER
            y: -10
            text: "\U000F09AB"
            text_font: mdi_80
            text_color: 0xFFFFFF
        # Egg timer countdown (visible only when timer is running and egg timer is selected)
        - label:
            id: lbl_timer
            align: CENTER
            y: 55
            text: ""
            text_font: roboto_18
            text_color: 0xFFFFFF
        # Light-selection dots (● current, ○ others) near bottom
        - label:
            id: lbl_dots
            align: CENTER
            y: 80
            text: "● ○ ○ ○ ○ ○"
            text_font: roboto_dots
            text_color: 0xFFFFFF
    - id: canary_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: canary_bg
            width: 240
            height: 240
            align: CENTER
            bg_color: 0x1A3300
            border_width: 0
            radius: 0
            pad_all: 0
        - label:
            id: canary_icon_lbl
            align: CENTER
            y: -20
            text: "\U000F15C6"
            text_font: mdi_80
            text_color: 0xFFDD00
        - label:
            id: canary_status_lbl
            align: CENTER
            y: 60
            text: "Air OK"
            text_font: roboto_18
            text_color: 0x88FF88
        - label:
            id: canary_reason_lbl
            align: CENTER
            y: 85
            max_width: 90%
            width: 90%
            text_align: CENTER
            text: ""
            text_font: roboto_18
            text_color: 0xFF8888
    - id: cleaning_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: clean_bg
            width: 240
            height: 240
            align: CENTER
            bg_color: 0x333333
            border_width: 0
            radius: 0
            pad_all: 0
        - label:
            id: clean_icon_lbl
            align: CENTER
            y: -30
            text: "\U000F104D"
            text_font: mdi_80
            text_color: 0xFFFFFF
        - label:
            id: clean_name_lbl
            align: CENTER
            y: 45
            max_width: 90%
            width: 90%
            text_align: CENTER
            text: "Whole Flat"
            text_font: roboto_18
            text_color: 0xFFFFFF
        - label:
            id: clean_dots_lbl
            align: CENTER
            y: 80
            text: "● ○ ○ ○ ○ ○ ○ ○ ○"
            text_font: roboto_dots
            text_color: 0xFFFFFF
    - id: settings_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: settings_bg
            width: 240
            height: 240
            align: CENTER
            bg_color: 0x222244
            border_width: 0
            radius: 0
            pad_all: 0
        - label:
            id: settings_icon_lbl
            align: CENTER
            y: -60
            text: "\U000F05A9"  # wifi
            text_font: mdi_80
            text_color: 0xFFFFFF
        - label:
            id: wifi_ssid_lbl
            align: CENTER
            y: 25
            max_width: 90%
            width: 90%
            text_align: CENTER
            text: ""
            text_font: roboto_18
            text_color: 0xFFFFFF
        - label:
            id: wifi_ip_lbl
            align: CENTER
            y: 55
            max_width: 90%
            width: 90%
            text_align: CENTER
            text: ""
            text_font: roboto_18
            text_color: 0x99AAFF
