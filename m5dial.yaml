substitutions:
  name: "m5dial"
  friendly_name: "M5Dial"
  screensaver: "5min"
  # ──── Lights ────────────────────────────────────────────────────────────────
  # Set num_lights to match the number of light slots below (max: add more blocks).
  # To add a light: add substitutions, a brN global, a sensor block, and an if-block
  # in the get_current_light script.
  num_lights: "4"
  light0_entity: "light.bathroom_nightlight_bathroom_nightlight"
  light0_name:   "Bathroom"
  light1_entity: "light.kitchen_lights_small_lights"
  light1_name:   "Kitchen Small"
  light2_entity: "light.kitchen_lights_big_lights"
  light2_name:   "Kitchen Big"
  light3_entity: "light.desk_light_desk_light"
  light3_name:   "Desk"
  # ──── Action items ──────────────────────────────────────────────────────────
  # num_items = num_lights + number of action slots (egg timer + find phone + cleaning + settings = 4)
  num_items: "8"
  phone_ring_entity: "button.fmd_rafa_volume_ring_device"
  # Egg timer lives in HA (timer helper, duration 6:35, restore on) so a dial
  # reboot can't lose it. HA automation on timer.finished calls the dial's
  # egg_alarm action to play the tune.
  egg_timer_entity: "timer.egg"
  # ──── Cleaning (Juanita) ────────────────────────────────────────────────────
  # Calls vacuum.juanita (Roborock) directly — vacuum.start for the whole flat,
  # vacuum.send_command (app_segment_clean) with a hardcoded segment id per room.
  # Segment ids come from `roborock.get_maps` on vacuum.juanita and only change
  # if the flat is remapped.
  vacuum_entity: "vacuum.juanita"
  num_clean_rooms: "7"
  clean_room0_name: "Corridor"
  clean_room0_id: "16"
  clean_room1_name: "Bathroom"
  clean_room1_id: "17"
  clean_room2_name: "Bedroom"
  clean_room2_id: "19"
  clean_room3_name: "Rafas office"
  clean_room3_id: "18"
  clean_room4_name: "Carpet"
  clean_room4_id: "22"
  clean_room5_name: "Kitchen"
  clean_room5_id: "24"
  clean_room6_name: "Jadalnia"
  clean_room6_id: "23"
  # ──── Controller presence (BLE) ─────────────────────────────────────────────
  # Controllers are matched by advertised NAME in esp32_ble_tracker below (not
  # MAC — the Steam controller's address rotates on re-pair). HA watches the
  # resulting binary sensors and fires the bazzite Wake-on-LAN automation.
  # ────────────────────────────────────────────────────────────────────────────
  sdapin: GPIO11
  sclpin: GPIO12
  tres: GPIO8
  dcpin: GPIO4
  bkpin: GPIO9
  clpin: GPIO6
  mopin: GPIO5
  cspin: GPIO7
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - m5dial_anim.h
  on_boot:
    priority: -100
    then:
      # Initialize controller presence to "off" (template sensors start "unknown",
      # which would make the wake automation's off->on trigger miss the first
      # sighting after a reboot).
      - lambda: |-
          id(xbox_nearby).publish_state(false);
          id(steam_nearby).publish_state(false);
      - script.execute: get_current_light
      - script.execute: screentime
      - script.execute: update_display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_password

captive_portal:

logger:
  level: DEBUG

# Crash diagnostics: logs the reset reason on boot and exposes it (plus uptime)
# to HA, so an unexpected reboot shows up as uptime dropping to ~0 with a reason.
debug:
  update_interval: 60s

# Wall clock from HA — the egg countdown is computed against finishes_at.
time:
  - platform: homeassistant
    id: ha_time

api:
  encryption:
    key: !secret api_encryption_key
  # Called by the HA automation when ${egg_timer_entity} finishes
  # (action: esphome.m5dial_egg_alarm).
  actions:
    - action: egg_alarm
      then:
        - script.execute: timer_beep

ota:
  platform: esphome
  password: !secret ota_password

# Detect the game controllers by their advertised NAME, not MAC. The Steam
# controller uses a random address that changes every time it's re-paired
# (verified 2026-09-21: MAC rotated, name stayed "SteamController"), so matching
# on MAC breaks after a re-pair. Names are only present in the scan RESPONSE, so
# active scanning is required here.
esp32_ble_tracker:
  scan_parameters:
    active: true
  on_ble_advertise:
    then:
      - lambda: |-
          const std::string &n = x.get_name();
          if (n.empty()) return;
          if (n.find("Xbox Wireless") != std::string::npos) {
            id(xbox_last_ms) = millis();
            id(xbox_nearby).publish_state(true);
          } else if (n.find("SteamController") != std::string::npos) {
            id(steam_last_ms) = millis();
            id(steam_nearby).publish_state(true);
          }

i2c:
  - id: bus_internal
    sda: ${sdapin}
    scl: ${sclpin}
    scan: false

spi:
  mosi_pin: ${mopin}
  clk_pin: ${clpin}

display:
  - platform: ili9xxx
    model: GC9A01A
    id: watchface
    cs_pin: ${cspin}
    dc_pin: ${dcpin}
    reset_pin: ${tres}
    invert_colors: true
    rotation: 0
    dimensions:
      width: 240
      height: 240

touchscreen:
  - platform: ft5x06
    id: ts
    i2c_id: bus_internal
    address: 0x38
    on_touch:
      then:
        - lambda: |-
            if (id(attention_active)) {
              return;
            }
            if (id(canary_visible)) {
              id(dismiss_canary).execute();
              return;
            }
            if (id(sel) == ${num_lights}) {
              id(timer_beep).execute();
            } else if (id(dim_mode) && id(sel) < ${num_lights}) {
              id(toggle_light).execute();
            }

output:
  - id: oledbacklight
    platform: ledc
    pin: ${bkpin}
    max_power: 1
    min_power: 0.1
  - id: buzzer
    platform: ledc
    pin: GPIO3

rtttl:
  output: buzzer

light:
  - platform: monochromatic
    output: oledbacklight
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms

globals:
  - id: sel
    type: int
    restore_value: no
    initial_value: '0'
  - id: dim_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: current_entity
    type: std::string
    restore_value: no
    initial_value: '"${light0_entity}"'
  - id: current_name
    type: std::string
    restore_value: no
    initial_value: '"${light0_name}"'
  - id: current_icon
    type: std::string
    restore_value: no
    initial_value: '"\U000F09AB"'
  - id: current_brightness
    type: int
    restore_value: no
    initial_value: '0'
  # Per-light cached brightness (0–255; 0 = off)
  - id: br0
    type: int
    restore_value: no
    initial_value: '0'
  - id: br1
    type: int
    restore_value: no
    initial_value: '0'
  - id: br2
    type: int
    restore_value: no
    initial_value: '0'
  - id: br3
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_encoder_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Brightness dial: timestamp of the last brightness detent + the working
  # brightness % (0-100). Used for speed-based acceleration and stop-to-wrap.
  - id: bright_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: bright_pct
    type: int
    restore_value: no
    initial_value: '0'
  - id: timer_running
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: timer_remaining
    type: int
    restore_value: no
    initial_value: '0'
  # finishes_at of ${egg_timer_entity} as unix epoch (0 = unknown), parsed in
  # the egg_finishes_at text sensor.
  - id: timer_end_epoch
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: blink_entity
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: blink_brightness
    type: int
    restore_value: no
    initial_value: '0'
  - id: canary_visible
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: air_co2
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: air_hcho
    type: float
    restore_value: no
    initial_value: '0.0'
  # Last time (millis) each controller's advertisement was heard; used to time
  # out the name-based presence sensors below.
  - id: xbox_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: steam_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: in_cleaning_menu
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: in_settings
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: clean_sel
    type: int
    restore_value: no
    initial_value: '0'
  - id: current_clean_display
    type: std::string
    restore_value: no
    initial_value: '"Whole Flat"'
  - id: current_clean_icon
    type: std::string
    restore_value: no
    initial_value: '"\U000F104D"'
  # High-priority "Attention Required" alert. True while the attention_text is
  # non-empty; drives the takeover page and the repeating 3-tone beep.
  - id: attention_active
    type: bool
    restore_value: no
    initial_value: 'false'

font:
  - file: "gfonts://Roboto"
    id: roboto_18
    size: 18
    glyphsets: [GF_Latin_Kernel]
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_80
    size: 80
    glyphs:
      - "\U000F09AB"  # mdi:toilet      → Bathroom
      - "\U000F1B29"  # mdi:faucet      → Kitchen Small
      - "\U000F065A"  # mdi:pot-steam   → Kitchen Big
      - "\U000F0E51"  # mdi:monitor     → Desk
      - "\U000F0AAF"  # mdi:egg          → Egg Timer
      - "\U000F03F2"  # mdi:phone       → Find Phone
      - "\U000F15C6"  # mdi:bird        → Canary alive
      - "\U000F0C6E"  # mdi:emoticon-dead → Canary dead
      - "\U000F00E2"  # mdi:broom               → Cleaning (main menu)
      - "\U000F104D"  # mdi:home-circle-outline → Whole Flat
      - "\U000F0CDD"  # mdi:arrow-left-circle   → Back
      - "\U000F0B47"  # mdi:shoe-formal         → Corridor
      - "\U000F08A0"  # mdi:bed-empty           → Bedroom
      - "\U000F0AAB"  # mdi:desktop-tower-monitor → Rafas office
      - "\U000F1475"  # mdi:rug                 → Carpet
      - "\U000F028F"  # mdi:fridge-outline      → Kitchen
      - "\U000F1061"  # mdi:table-chair         → Jadalnia
      - "\U000F0493"  # mdi:cog                 → Settings
      - "\U000F05A9"  # mdi:wifi                → WiFi info
      - "\U000F0026"  # mdi:alert               → Attention Required
  - file: "gfonts://Roboto"
    id: roboto_dots
    size: 10
    glyphs: "● ○"

# ──── HA brightness sensors ─────────────────────────────────────────────────
# brightness attribute is 0-255; NaN when the light is off (stored as 0).
# Duplicate this block for each additional light — keep entity_id, id, global
# and the get_current_light if-block in sync.
sensor:
  - platform: uptime
    name: "Uptime"
  - platform: debug
    free:
      name: "Heap Free"
    min_free:
      name: "Heap Min Free"
  - platform: homeassistant
    entity_id: ${light0_entity}
    attribute: brightness
    id: ha_br0
    on_value:
      then:
        - globals.set:
            id: br0
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int)x;
        - if:
            condition: {lambda: return id(sel) == 0;}
            then:
              - globals.set:
                  id: current_brightness
                  value: !lambda |-
                    if (std::isnan(x)) return 0;
                    return (int)x;
              - script.execute: update_display

  - platform: homeassistant
    entity_id: ${light1_entity}
    attribute: brightness
    id: ha_br1
    on_value:
      then:
        - globals.set:
            id: br1
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int)x;
        - if:
            condition: {lambda: return id(sel) == 1;}
            then:
              - globals.set:
                  id: current_brightness
                  value: !lambda |-
                    if (std::isnan(x)) return 0;
                    return (int)x;
              - script.execute: update_display

  - platform: homeassistant
    entity_id: ${light2_entity}
    attribute: brightness
    id: ha_br2
    on_value:
      then:
        - globals.set:
            id: br2
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int)x;
        - if:
            condition: {lambda: return id(sel) == 2;}
            then:
              - globals.set:
                  id: current_brightness
                  value: !lambda |-
                    if (std::isnan(x)) return 0;
                    return (int)x;
              - script.execute: update_display

  - platform: homeassistant
    entity_id: ${light3_entity}
    attribute: brightness
    id: ha_br3
    on_value:
      then:
        - globals.set:
            id: br3
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int)x;
        - if:
            condition: {lambda: return id(sel) == 3;}
            then:
              - globals.set:
                  id: current_brightness
                  value: !lambda |-
                    if (std::isnan(x)) return 0;
                    return (int)x;
              - script.execute: update_display

  - platform: homeassistant
    entity_id: sensor.mt15_mt29_carbon_dioxide
    id: ha_co2
    on_value:
      then:
        - globals.set:
            id: air_co2
            value: !lambda return x;
        - if:
            condition: {lambda: return id(canary_visible);}
            then:
              - script.execute: update_canary_display

  - platform: homeassistant
    entity_id: sensor.mt15_mt29_formaldehyde
    id: ha_hcho
    on_value:
      then:
        - globals.set:
            id: air_hcho
            value: !lambda return x;
        - if:
            condition: {lambda: return id(canary_visible);}
            then:
              - script.execute: update_canary_display

  - platform: rotary_encoder
    name: "Rotary Encoder"
    id: rotaryencoder
    pin_a:
      number: GPIO40
      mode: {input: true, pullup: true}
    pin_b:
      number: GPIO41
      mode: {input: true, pullup: true}
    resolution: 1
    on_clockwise:
      then:
        - lambda: |-
            if (id(attention_active)) {
              return;
            }
            if (id(canary_visible)) {
              id(dismiss_canary).execute();
              return;
            }
            uint32_t now = millis();
            // Brightness adjust: accelerate with turn speed, no 80ms throttle.
            if (id(dim_mode) && id(sel) < ${num_lights} && !id(in_settings) && !id(in_cleaning_menu)) {
              uint32_t dt = now - id(bright_last_ms);
              id(bright_last_ms) = now;
              id(last_encoder_ms) = now;
              id(screentime).execute();
              // Fresh turn (paused >=500ms): re-anchor to the light's real level.
              if (dt >= 500) id(bright_pct) = (id(current_brightness) * 100 + 127) / 255;
              int step = dt < 25 ? 25 : dt < 50 ? 15 : dt < 100 ? 9 : dt < 200 ? 6 : 4;
              if (id(bright_pct) >= 100) {
                // At max: keep turning stays at 100; stop then turn wraps to off.
                if (dt >= 500) id(bright_pct) = 0;
              } else {
                id(bright_pct) += step;
                if (id(bright_pct) > 100) id(bright_pct) = 100;  // land on 100, no wrap
              }
              id(current_brightness) = id(bright_pct) * 255 / 100;
              id(set_brightness).execute();
              id(update_display).execute();
              return;
            }
            if ((now - id(last_encoder_ms)) < 80) return;
            id(last_encoder_ms) = now;
            id(screentime).execute();
            if (id(in_settings)) return;
            if (id(in_cleaning_menu)) {
              id(clean_sel) = (id(clean_sel) + 1) % (${num_clean_rooms} + 2);
              id(get_current_clean_room).execute();
              id(update_cleaning_display).execute();
              return;
            }
            if (id(sel) < ${num_lights}) id(restore_blink_light).execute();
            id(sel) = (id(sel) + 1) % ${num_items};
            id(get_current_light).execute();
            id(update_display).execute();
            if (id(sel) < ${num_lights}) id(select_blink).execute();
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(attention_active)) {
              return;
            }
            if (id(canary_visible)) {
              id(dismiss_canary).execute();
              return;
            }
            uint32_t now = millis();
            // Brightness adjust: accelerate with turn speed, no 80ms throttle.
            if (id(dim_mode) && id(sel) < ${num_lights} && !id(in_settings) && !id(in_cleaning_menu)) {
              uint32_t dt = now - id(bright_last_ms);
              id(bright_last_ms) = now;
              id(last_encoder_ms) = now;
              id(screentime).execute();
              // Fresh turn (paused >=500ms): re-anchor to the light's real level.
              if (dt >= 500) id(bright_pct) = (id(current_brightness) * 100 + 127) / 255;
              int step = dt < 25 ? 25 : dt < 50 ? 15 : dt < 100 ? 9 : dt < 200 ? 6 : 4;
              if (id(bright_pct) <= 0) {
                // At off: keep turning stays off; stop then turn wraps to full.
                if (dt >= 500) id(bright_pct) = 100;
              } else {
                id(bright_pct) -= step;
                if (id(bright_pct) < 0) id(bright_pct) = 0;  // land on off, no wrap
              }
              id(current_brightness) = id(bright_pct) * 255 / 100;
              id(set_brightness).execute();
              id(update_display).execute();
              return;
            }
            if ((now - id(last_encoder_ms)) < 80) return;
            id(last_encoder_ms) = now;
            id(screentime).execute();
            if (id(in_settings)) return;
            if (id(in_cleaning_menu)) {
              id(clean_sel) = (id(clean_sel) + (${num_clean_rooms} + 2) - 1) % (${num_clean_rooms} + 2);
              id(get_current_clean_room).execute();
              id(update_cleaning_display).execute();
              return;
            }
            if (id(sel) < ${num_lights}) id(restore_blink_light).execute();
            id(sel) = (id(sel) + ${num_items} - 1) % ${num_items};
            id(get_current_light).execute();
            id(update_display).execute();
            if (id(sel) < ${num_lights}) id(select_blink).execute();

binary_sensor:
  # Driven by name matches in esp32_ble_tracker.on_ble_advertise above. Set true
  # on each sighting; the 1s interval clears them after 15s of silence. The
  # controllers advertise in bursts with gaps, so hold "on" for 30s after the
  # last sighting via delayed_off; HA then sees one off->on per real arrival and
  # the sensor re-arms quickly once the controller actually leaves.
  - platform: template
    id: xbox_nearby
    name: "Xbox Controller Nearby"
    filters:
      - delayed_off: 30s

  - platform: template
    id: steam_nearby
    name: "Steam Controller Nearby"
    filters:
      - delayed_off: 30s

  - platform: gpio
    pin:
      number: GPIO42
      mode: {input: true, pullup: true}
      inverted: true
    id: dial_button
    filters:
      - delayed_on: 10ms
    on_multi_click:
      - timing:
          - ON for 50ms to 500ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              if (id(attention_active)) {
                id(acknowledge_attention).execute();
                return;
              }
              if (id(canary_visible)) {
                id(dismiss_canary).execute();
                return;
              }
              id(screentime).execute();
              if (id(in_settings)) {
                id(exit_settings).execute();
                return;
              }
              if (id(in_cleaning_menu)) {
                if (id(clean_sel) == ${num_clean_rooms} + 1) {
                  id(exit_cleaning_menu).execute();
                } else {
                  id(start_clean).execute();
                }
                return;
              }
              if (id(sel) < ${num_lights}) {
                if (!id(dim_mode)) {
                  id(restore_blink_light).execute();
                  id(blink_entity) = std::string("");
                }
                id(dim_mode) = !id(dim_mode);
                id(update_display).execute();
              } else if (id(sel) == ${num_lights}) {
                id(start_egg_timer).execute();
              } else if (id(sel) == ${num_lights} + 1) {
                id(ring_phone).execute();
              } else if (id(sel) == ${num_lights} + 2) {
                id(enter_cleaning_menu).execute();
              } else {
                id(enter_settings).execute();
              }
      - timing:
          - ON for at least 700ms
        then:
          - lambda: |-
              if (id(attention_active)) {
                id(acknowledge_attention).execute();
                return;
              }
              if (id(canary_visible)) {
                id(dismiss_canary).execute();
                return;
              }
              id(screentime).execute();
              if (id(sel) < ${num_lights}) {
                id(toggle_light).execute();
              }

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Clear controller presence after 15s without a fresh advertisement.
          // MUST run every tick (independent of the egg timer) so the sensors
          // re-arm; otherwise they latch ON and the wake never re-triggers.
          uint32_t now = millis();
          if (id(xbox_last_ms) && now - id(xbox_last_ms) > 15000) id(xbox_nearby).publish_state(false);
          if (id(steam_last_ms) && now - id(steam_last_ms) > 15000) id(steam_nearby).publish_state(false);
          // Egg countdown: HA owns the timer (state + finishes_at); we only
          // derive the remaining seconds for display. HA fires the alarm.
          auto t_now = id(ha_time).now();
          id(timer_running) = id(egg_state).state == "active" &&
                              id(timer_end_epoch) != 0 && t_now.is_valid();
          if (!id(timer_running)) return;
          int64_t left = id(timer_end_epoch) - (int64_t) t_now.timestamp;
          id(timer_remaining) = left > 0 ? (int) left : 0;
          if (id(sel) == ${num_lights}) {
            id(update_display).execute();
          }
  # Re-nag every 5 minutes while an attention alert is unacknowledged.
  - interval: 5min
    then:
      - if:
          condition:
            lambda: return id(attention_active);
          then:
            - script.execute: attention_beep

script:
  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - if:
          condition: {lambda: return id(attention_active);}
          then:
            - lvgl.page.show: attention_page
          else:
            - if:
                condition: {lambda: return id(in_cleaning_menu);}
                then:
                  - lvgl.page.show: cleaning_page
                else:
                  - if:
                      condition: {lambda: return id(in_settings);}
                      then:
                        - lvgl.page.show: settings_page
                      else:
                        - lvgl.page.show: main_page
      - delay: ${screensaver}
      - script.execute: show_canary

  - id: show_canary
    mode: single
    then:
      - if:
          condition: {lambda: return id(attention_active);}
          then:
            - lvgl.page.show: attention_page
          else:
            - globals.set:
                id: canary_visible
                value: 'true'
            - script.execute: update_canary_display
            - lvgl.page.show: canary_page

  - id: dismiss_canary
    mode: single
    then:
      - globals.set:
          id: canary_visible
          value: 'false'
      - globals.set:
          id: in_cleaning_menu
          value: 'false'
      - lvgl.page.show: main_page
      - script.execute: update_display
      - script.execute: screentime

  - id: update_canary_display
    mode: single
    then:
      - lambda: |-
          bool co2_high = id(air_co2) >= 1500.0f;
          bool hcho_high = id(air_hcho) >= 0.3f;
          bool bad = co2_high || hcho_high;
          lv_obj_set_style_bg_color(id(canary_bg),
            bad ? lv_color_hex(0x550000) : lv_color_hex(0x1A3300), LV_PART_MAIN);
          lv_label_set_text(id(canary_icon_lbl),
            bad ? "\U000F0C6E" : "\U000F15C6");
          lv_obj_set_style_text_color(id(canary_icon_lbl),
            bad ? lv_color_hex(0xFF3333) : lv_color_hex(0xFFDD00), LV_PART_MAIN);
          lv_label_set_text(id(canary_status_lbl),
            bad ? "Bad Air!" : "Air OK");
          lv_obj_set_style_text_color(id(canary_status_lbl),
            bad ? lv_color_hex(0xFF8888) : lv_color_hex(0x88FF88), LV_PART_MAIN);
          std::string reason;
          if (co2_high && hcho_high) {
            reason = "CO2 & HCHO high";
          } else if (co2_high) {
            reason = "CO2 high";
          } else if (hcho_high) {
            reason = "HCHO high";
          }
          lv_label_set_text(id(canary_reason_lbl), reason.c_str());
          lv_obj_invalidate(id(canary_bg));

  # Updates current_entity, current_name, current_brightness from sel.
  # Add one if-block here for each additional light.
  - id: get_current_light
    mode: single
    then:
      - if:
          condition: {lambda: return id(sel) == 0;}
          then:
            - globals.set:
                id: current_entity
                value: !lambda return "${light0_entity}";
            - globals.set:
                id: current_name
                value: !lambda return "${light0_name}";
            - globals.set:
                id: current_icon
                value: !lambda return "\U000F09AB";  # toilet
            - globals.set:
                id: current_brightness
                value: !lambda return id(br0);
      - if:
          condition: {lambda: return id(sel) == 1;}
          then:
            - globals.set:
                id: current_entity
                value: !lambda return "${light1_entity}";
            - globals.set:
                id: current_name
                value: !lambda return "${light1_name}";
            - globals.set:
                id: current_icon
                value: !lambda return "\U000F1B29";  # faucet
            - globals.set:
                id: current_brightness
                value: !lambda return id(br1);
      - if:
          condition: {lambda: return id(sel) == 2;}
          then:
            - globals.set:
                id: current_entity
                value: !lambda return "${light2_entity}";
            - globals.set:
                id: current_name
                value: !lambda return "${light2_name}";
            - globals.set:
                id: current_icon
                value: !lambda return "\U000F065A";  # pot-steam
            - globals.set:
                id: current_brightness
                value: !lambda return id(br2);
      - if:
          condition: {lambda: return id(sel) == 3;}
          then:
            - globals.set:
                id: current_entity
                value: !lambda return "${light3_entity}";
            - globals.set:
                id: current_name
                value: !lambda return "${light3_name}";
            - globals.set:
                id: current_icon
                value: !lambda return "\U000F0E51";  # monitor
            - globals.set:
                id: current_brightness
                value: !lambda return id(br3);
      - if:
          condition:
            lambda: return id(sel) == ${num_lights};
          then:
            - globals.set:
                id: current_entity
                value: !lambda return std::string("");
            - globals.set:
                id: current_name
                value: !lambda return std::string("Egg Timer");
            - globals.set:
                id: current_icon
                value: !lambda return std::string("\U000F0AAF");
            - globals.set:
                id: current_brightness
                value: !lambda return 0;
      - if:
          condition:
            lambda: return id(sel) == ${num_lights} + 1;
          then:
            - globals.set:
                id: current_entity
                value: !lambda return std::string("");
            - globals.set:
                id: current_name
                value: !lambda return std::string("Find Phone");
            - globals.set:
                id: current_icon
                value: !lambda return std::string("\U000F03F2");
            - globals.set:
                id: current_brightness
                value: !lambda return 0;
      - if:
          condition:
            lambda: return id(sel) == ${num_lights} + 2;
          then:
            - globals.set:
                id: current_entity
                value: !lambda return std::string("");
            - globals.set:
                id: current_name
                value: !lambda return std::string("Cleaning");
            - globals.set:
                id: current_icon
                value: !lambda return std::string("\U000F00E2");
            - globals.set:
                id: current_brightness
                value: !lambda return 0;
      - if:
          condition:
            lambda: return id(sel) == ${num_lights} + 3;
          then:
            - globals.set:
                id: current_entity
                value: !lambda return std::string("");
            - globals.set:
                id: current_name
                value: !lambda return std::string("Settings");
            - globals.set:
                id: current_icon
                value: !lambda return std::string("\U000F0493");
            - globals.set:
                id: current_brightness
                value: !lambda return 0;

  # Updates current_clean_display, current_clean_icon from clean_sel.
  # 0 = Whole Flat, 1..num_clean_rooms = individual rooms, last slot = Back.
  - id: get_current_clean_room
    mode: single
    then:
      - if:
          condition:
            lambda: return id(clean_sel) == 0;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return std::string("Whole Flat");
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F104D");
      - if:
          condition:
            lambda: return id(clean_sel) == 1;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room0_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F0B47");
      - if:
          condition:
            lambda: return id(clean_sel) == 2;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room1_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F09AB");
      - if:
          condition:
            lambda: return id(clean_sel) == 3;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room2_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F08A0");
      - if:
          condition:
            lambda: return id(clean_sel) == 4;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room3_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F0AAB");
      - if:
          condition:
            lambda: return id(clean_sel) == 5;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room4_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F1475");
      - if:
          condition:
            lambda: return id(clean_sel) == 6;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room5_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F028F");
      - if:
          condition:
            lambda: return id(clean_sel) == 7;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return "${clean_room6_name}";
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F1061");
      - if:
          condition:
            lambda: return id(clean_sel) == ${num_clean_rooms} + 1;
          then:
            - globals.set:
                id: current_clean_display
                value: !lambda return std::string("Back");
            - globals.set:
                id: current_clean_icon
                value: !lambda return std::string("\U000F0CDD");

  - id: update_cleaning_display
    mode: single
    then:
      - lvgl.label.update:
          id: clean_icon_lbl
          text: !lambda return id(current_clean_icon);
      - lvgl.label.update:
          id: clean_name_lbl
          text: !lambda return id(current_clean_display);
      - lvgl.label.update:
          id: clean_dots_lbl
          text: !lambda |-
            std::string s;
            int total = ${num_clean_rooms} + 2;
            for (int i = 0; i < total; i++) {
              if (i > 0) s += " ";
              s += (i == id(clean_sel)) ? "●" : "○";
            }
            return s;

  - id: enter_cleaning_menu
    mode: single
    then:
      - globals.set: {id: in_cleaning_menu, value: 'true'}
      - globals.set: {id: clean_sel, value: '0'}
      - script.execute: get_current_clean_room
      - script.execute: update_cleaning_display
      - lvgl.page.show: cleaning_page

  - id: exit_cleaning_menu
    mode: single
    then:
      - globals.set: {id: in_cleaning_menu, value: 'false'}
      - lvgl.page.show: main_page
      - script.execute: update_display

  # Settings: single option (WiFi) showing the connected SSID and this device's IP.
  - id: enter_settings
    mode: single
    then:
      - globals.set: {id: in_settings, value: 'true'}
      - lvgl.label.update:
          id: wifi_ssid_lbl
          text: !lambda |-
            std::string s = id(wifi_ssid_txt).state;
            return s.empty() ? std::string("Not connected") : s;
      - lvgl.label.update:
          id: wifi_ip_lbl
          text: !lambda |-
            std::string s = id(wifi_ip_txt).state;
            return s.empty() ? std::string("—") : s;
      - lvgl.page.show: settings_page

  - id: exit_settings
    mode: single
    then:
      - globals.set: {id: in_settings, value: 'false'}
      - lvgl.page.show: main_page
      - script.execute: update_display

  # Calls vacuum.juanita directly (no HA automation involved), mirroring how
  # lights are toggled. clean_sel 0 = whole flat; 1..num_clean_rooms = a single
  # room, cleaned via a hardcoded Roborock segment id.
  - id: start_clean
    mode: single
    then:
      - if:
          condition:
            lambda: return id(clean_sel) == 0;
          then:
            - homeassistant.action:
                action: vacuum.start
                data:
                  entity_id: "${vacuum_entity}"
      - if:
          condition:
            lambda: return id(clean_sel) == 1;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room0_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 2;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room1_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 3;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room2_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 4;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room3_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 5;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room4_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 6;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room5_id}], 'repeat': 1}] }}"
      - if:
          condition:
            lambda: return id(clean_sel) == 7;
          then:
            - homeassistant.action:
                action: vacuum.send_command
                data:
                  entity_id: "${vacuum_entity}"
                  command: app_segment_clean
                data_template:
                  params: "{{ [{'segments': [${clean_room6_id}], 'repeat': 1}] }}"

  - id: update_display
    mode: single
    then:
      # SELECT: colored bg + white icon. DIM: dark multimeter face + gauge needle.
      - lambda: |-
          lv_color_t target;
          if (!id(dim_mode) || id(sel) >= ${num_lights}) {
            static const uint32_t c[] = {0x005599, 0xAA4400, 0xAA7700, 0x005533, 0x885500, 0x006644, 0x555555, 0x333366};
            target = lv_color_hex(c[id(sel)]);
          } else {
            target = lv_color_hex(0x111111);   // multimeter face
          }
          m5dial_animate_bg(id(bg), target, 300);
      # DIM mode: show the analogue brightness gauge (ticks 0/25/50/75/100 + red
      # needle); the central hub keeps the needle from touching the room icon.
      - if:
          condition:
            lambda: return id(dim_mode) && id(sel) < ${num_lights};
          then:
            - lvgl.widget.show: bright_meter
            - lvgl.widget.show: bright_hub
            - lvgl.indicator.update:
                id: bright_needle
                value: !lambda return (id(current_brightness) * 100 + 127) / 255;
          else:
            - lvgl.widget.hide: bright_meter
            - lvgl.widget.hide: bright_hub
      - lvgl.label.update:
          id: lbl_icon
          text: !lambda return id(current_icon);
          text_color: !lambda |-
            if (!id(dim_mode) || id(sel) >= ${num_lights}) return lv_color_hex(0xFFFFFF);
            static const uint32_t c[] = {0x005599, 0xAA4400, 0xAA7700, 0x005533, 0x885500, 0x006644, 0x555555, 0x333366};
            return lv_color_hex(c[id(sel)]);
      # Dot row: white in SELECT, room color in DIM
      - lvgl.label.update:
          id: lbl_dots
          text: !lambda |-
            std::string s;
            for (int i = 0; i < ${num_items}; i++) {
              if (i > 0) s += " ";
              s += (i == id(sel)) ? "●" : "○";
            }
            return s;
          text_color: !lambda |-
            if (!id(dim_mode) || id(sel) >= ${num_lights}) return lv_color_hex(0xFFFFFF);
            static const uint32_t c[] = {0x005599, 0xAA4400, 0xAA7700, 0x005533, 0x885500, 0x006644, 0x555555, 0x333366};
            return lv_color_hex(c[id(sel)]);
      - lvgl.label.update:
          id: lbl_timer
          text: !lambda |-
            if (id(sel) == ${num_lights} && id(timer_running)) {
              int t = id(timer_remaining);
              char buf[8];
              snprintf(buf, sizeof(buf), "%d:%02d", t / 60, t % 60);
              return std::string(buf);
            }
            return std::string("");

  # Push the working brightness (id(bright_pct), 0-100) to the current light.
  # 0 means off; the encoder handlers compute the accelerated value.
  - id: set_brightness
    mode: queued
    then:
      - if:
          condition:
            lambda: return id(bright_pct) <= 0;
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda return id(current_entity);
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(current_entity);
                  brightness_pct: !lambda return std::to_string(id(bright_pct));

  - id: select_blink
    mode: restart
    then:
      - globals.set:
          id: blink_entity
          value: !lambda return id(current_entity);
      - globals.set:
          id: blink_brightness
          value: !lambda return id(current_brightness);
      - repeat:
          count: 4
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(blink_entity);
                  brightness_pct: "70"
                  transition: "1.0"
            - delay: 1200ms
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(blink_entity);
                  brightness_pct: "20"
                  transition: "1.0"
            - delay: 1200ms
      - if:
          condition:
            lambda: return id(blink_brightness) == 0;
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda return id(blink_entity);
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(blink_entity);
                  brightness_pct: !lambda |-
                    int pct = id(blink_brightness) * 100 / 255;
                    return std::to_string(pct < 1 ? 1 : pct);
                  transition: "1.0"

  - id: restore_blink_light
    mode: single
    then:
      - script.stop: select_blink
      - if:
          condition:
            lambda: return !id(blink_entity).empty();
          then:
            - if:
                condition:
                  lambda: return id(blink_brightness) == 0;
                then:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: !lambda return id(blink_entity);
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda return id(blink_entity);
                        brightness_pct: !lambda |-
                          int pct = id(blink_brightness) * 100 / 255;
                          return std::to_string(pct < 1 ? 1 : pct);

  - id: toggle_light
    mode: single
    then:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: !lambda return id(current_entity);

  # Short press on egg timer slot starts/restarts the HA timer (its default
  # duration, 6 min 35 sec, is set on the helper).
  - id: start_egg_timer
    mode: restart
    then:
      - homeassistant.action:
          action: timer.start
          data:
            entity_id: "${egg_timer_entity}"

  - id: ring_phone
    mode: single
    then:
      - homeassistant.action:
          action: button.press
          data:
            entity_id: "${phone_ring_entity}"

  - id: timer_beep
    mode: single
    then:
      - rtttl.play: "HarryPot:d=8,o=6,b=125:b5,e.,16g,f#,4e,b,4a.,4f#.,e.,16g,f#,4d,f,2b5,p,b5,e.,16g,f#,4e,b,4d7,c#7,4c7,g#,c.7,16b,a#,4f#,g,2e,p,g,4b,g,4b,g,4c7,b,4a#,f#,g.,16b,a#,4a#5,b5,2b"

  # ──── Attention Required ─────────────────────────────────────────────────────
  # Three ascending, distinct tones — the "you need to look at the dial" alert.
  - id: attention_beep
    mode: single
    then:
      - rtttl.play: "attn:d=8,o=6,b=200:c,e,g"

  # Raise the alert: take over the screen with the message and beep once now.
  # (The 5-min interval keeps re-beeping until acknowledged.)
  - id: raise_attention
    mode: single
    then:
      - globals.set: {id: attention_active, value: 'true'}
      - globals.set: {id: canary_visible, value: 'false'}
      - light.turn_on: back_light
      - lvgl.label.update:
          id: attention_msg_lbl
          text: !lambda return id(attention_text).state;
      - lvgl.page.show: attention_page
      - script.execute: attention_beep

  # Acknowledge: clearing the text is the single source of truth. Emptying it
  # fires the text's on_value, which flips attention_active off and restores the
  # normal UI via clear_attention_ui.
  - id: acknowledge_attention
    mode: single
    then:
      - text.set:
          id: attention_text
          value: ""

  # Tear down the alert UI once the text is empty.
  - id: clear_attention_ui
    mode: single
    then:
      - globals.set: {id: attention_active, value: 'false'}
      - script.execute: screentime

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: homeassistant
    id: egg_state
    entity_id: ${egg_timer_entity}
    internal: true
    on_value:
      - script.execute: update_display
  # HA sends e.g. "2026-10-21T08:00:00+00:00"; HA doesn't send updates while the
  # attribute is absent (idle), so egg_state gates whether it's used.
  - platform: homeassistant
    id: egg_finishes_at
    entity_id: ${egg_timer_entity}
    attribute: finishes_at
    internal: true
    on_value:
      - lambda: |-
          int Y, M, D, h, m, sec, oh = 0, om = 0;
          char sign = '+';
          int n = sscanf(x.c_str(), "%d-%d-%dT%d:%d:%d", &Y, &M, &D, &h, &m, &sec);
          if (n != 6) { id(timer_end_epoch) = 0; return; }
          // Optional fractional seconds, then +HH:MM / -HH:MM offset.
          const char *tz = x.c_str() + 19;
          while (*tz == '.' || (*tz >= '0' && *tz <= '9')) tz++;
          if (*tz == '+' || *tz == '-') { sign = *tz; sscanf(tz + 1, "%d:%d", &oh, &om); }
          // days_from_civil (Howard Hinnant) — avoids timegm/TZ dependence.
          int y = Y - (M <= 2);
          int era = (y >= 0 ? y : y - 399) / 400;
          int yoe = y - era * 400;
          int doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
          int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
          int64_t days = (int64_t) era * 146097 + doe - 719468;
          int64_t off = (oh * 3600 + om * 60) * (sign == '-' ? -1 : 1);
          id(timer_end_epoch) = days * 86400 + h * 3600 + m * 60 + sec - off;
  - platform: wifi_info
    ssid:
      id: wifi_ssid_txt
      internal: true
    ip_address:
      id: wifi_ip_txt
      internal: true

text:
  - platform: template
    name: "RTTTL Song"
    id: rtttl_song
    mode: text
    optimistic: true
    initial_value: ""

  # High-priority notification. Set this (from HA) to raise an alert on the dial;
  # it clears itself when acknowledged. Restored across reboots so an urgent
  # alert survives a device restart.
  - platform: template
    name: "Attention Required"
    id: attention_text
    mode: text
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(attention_active) = !x.empty();
        - if:
            condition:
              lambda: return id(attention_active);
            then:
              - script.execute: raise_attention
            else:
              - script.execute: clear_attention_ui

button:
  - platform: template
    name: "Play RTTTL"
    on_press:
      then:
        - rtttl.play: !lambda 'return id(rtttl_song).state;'

  # Remote acknowledge — same effect as pressing the dial button.
  - platform: template
    name: "Acknowledge Attention"
    on_press:
      then:
        - script.execute: acknowledge_attention

lvgl:
  buffer_size: 50%
  displays:
    - watchface
  theme:
    label:
      text_color: 0xFFFFFF
  pages:
    - id: main_page
      bg_color: 0x000000
      widgets:
        # Full-screen background — color drives both SELECT (room colour) and DIM (brightness)
        - obj:
            id: bg
            width: 240
            height: 240
            align: CENTER
            bg_color: 0x005599
            border_width: 0
            radius: 0
            pad_all: 0
        # DIM-mode brightness gauge: analogue-multimeter scale (0/25/50/75/100)
        # with a red needle pointing at the current brightness. Hidden in SELECT.
        - meter:
            id: bright_meter
            width: 210
            height: 210
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            hidden: true
            scales:
              - range_from: 0
                range_to: 100
                angle_range: 270
                rotation: 135
                ticks:
                  count: 21
                  width: 2
                  length: 9
                  color: 0x666666
                  major:
                    stride: 5
                    width: 4
                    length: 14
                    color: 0xDDDDDD
                    label_gap: 6
                indicators:
                  - line:
                      id: bright_needle
                      width: 4
                      color: 0xFF0000
                      length: 92
                      value: 0
        # Central hub cap — hides the needle's base so it never touches the icon.
        - obj:
            id: bright_hub
            width: 96
            height: 96
            align: CENTER
            bg_color: 0x1A1A1A
            bg_opa: COVER
            border_width: 0
            radius: 48
            pad_all: 0
            hidden: true
        # Large room icon centred on screen
        - label:
            id: lbl_icon
            align: CENTER
            y: -10
            text: "\U000F09AB"
            text_font: mdi_80
            text_color: 0xFFFFFF
        # Egg timer countdown (visible only when timer is running and egg timer is selected)
        - label:
            id: lbl_timer
            align: CENTER
            y: 55
            text: ""
            text_font: roboto_18
            text_color: 0xFFFFFF
        # Light-selection dots (● current, ○ others) near bottom
        - label:
            id: lbl_dots
            align: CENTER
            y: 80
            text: "● ○ ○ ○ ○ ○"
            text_font: roboto_dots
            text_color: 0xFFFFFF
    - id: canary_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: canary_bg
            width: 240
            height: 240
            align: CENTER
            bg_color: 0x1A3300
