substitutions:
  device_name: "Electricity Consumption Assistant"
  friendly_name: "Electricity Consumption Assistant"

esphome:
  name: electricity-asst
  friendly_name: "${friendly_name}"

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Elec Asst Fallback"
    password: !secret wifi_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

sensor:
  - platform: homeassistant
    id: current_power
    entity_id: sensor.pstryk_current_power

  - platform: homeassistant
    id: current_buy_price
    entity_id: sensor.pstryk_current_buy_price

  - platform: homeassistant
    id: price_min_24h
    entity_id: sensor.pstryk_next_cheapest_price_24h

  - platform: homeassistant
    id: price_max_24h
    entity_id: sensor.pstryk_next_most_expensive_price_24h

globals:
  - id: blink_state
    type: bool
    initial_value: 'false'

output:
  - platform: template
    id: dummy_brightness
    type: float
    write_action:
      - lambda: return;

light:
  - platform: monochromatic
    name: "LED Brightness"
    id: led_brightness_control
    output: dummy_brightness
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

  # GPIO16: power indicator — green blink ≤100W, gradient 100–2000W, red blink ≥2000W
  - platform: esp32_rmt_led_strip
    chipset: SK6812
    pin: GPIO16
    num_leds: 1
    rgb_order: RGB
    is_wrgb: true
    id: power_led
    name: "Power LED"
    internal: true
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

  # GPIO4: price indicator — green blink at today's 24h-low, gradient between, red blink at 24h-high
  - platform: esp32_rmt_led_strip
    chipset: SK6812
    pin: GPIO4
    num_leds: 1
    rgb_order: RGB
    is_wrgb: true
    id: price_led
    name: "Price LED"
    internal: true
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

interval:
  - interval: 500ms
    then:
      - lambda: |-
          id(blink_state) = !id(blink_state);

          float brightness = id(led_brightness_control).current_values.get_brightness();

           float power = id(current_power).state;
           if (!isnan(power)) {
             if (power >= 2000.0f) {
               if (id(blink_state)) {
                 auto call = id(power_led).turn_on();
                 call.set_rgb(1.0f, 0.0f, 0.0f);
                 call.set_white(0.0f);
                 call.set_brightness(brightness);
                 call.set_transition_length(0);
                 call.perform();
               } else {
                 auto call = id(power_led).turn_off();
                 call.set_transition_length(0);
                 call.perform();
               }
             } else if (power <= 100.0f) {
               if (id(blink_state)) {
                 auto call = id(power_led).turn_on();
                 call.set_rgb(0.0f, 1.0f, 0.0f);
                 call.set_white(0.0f);
                 call.set_brightness(brightness);
                 call.set_transition_length(0);
                 call.perform();
               } else {
                 auto call = id(power_led).turn_off();
                 call.set_transition_length(0);
                 call.perform();
               }
             } else {
               float ratio = (power - 100.0f) / (2000.0f - 100.0f);
               auto call = id(power_led).turn_on();
               call.set_rgb(ratio, 1.0f - ratio, 0.0f);
               call.set_white(0.0f);
               call.set_brightness(brightness);
               call.set_transition_length(0);
               call.perform();
             }
           }

           float price = id(current_buy_price).state;
           float price_min = id(price_min_24h).state;
           float price_max = id(price_max_24h).state;
           if (!isnan(price) && !isnan(price_min) && !isnan(price_max)) {
             const float epsilon = 0.0001f;
             if ((price_max - price_min) < 0.001f) {
               auto call = id(price_led).turn_on();
               call.set_rgb(0.0f, 1.0f, 0.0f);
               call.set_white(0.0f);
               call.set_brightness(brightness);
               call.set_transition_length(0);
               call.perform();
             } else if (price <= price_min + epsilon) {
               if (id(blink_state)) {
                 auto call = id(price_led).turn_on();
                 call.set_rgb(0.0f, 1.0f, 0.0f);
                 call.set_white(0.0f);
                 call.set_brightness(brightness);
                 call.set_transition_length(0);
                 call.perform();
               } else {
                 auto call = id(price_led).turn_off();
                 call.set_transition_length(0);
                 call.perform();
               }
             } else if (price >= price_max - epsilon) {
               if (id(blink_state)) {
                 auto call = id(price_led).turn_on();
                 call.set_rgb(1.0f, 0.0f, 0.0f);
                 call.set_white(0.0f);
                 call.set_brightness(brightness);
                 call.set_transition_length(0);
                 call.perform();
               } else {
                 auto call = id(price_led).turn_off();
                 call.set_transition_length(0);
                 call.perform();
               }
             } else {
               float ratio = (price - price_min) / (price_max - price_min);
               if (ratio < 0.0f) ratio = 0.0f;
               if (ratio > 1.0f) ratio = 1.0f;
               auto call = id(price_led).turn_on();
               call.set_rgb(ratio, 1.0f - ratio, 0.0f);
               call.set_white(0.0f);
               call.set_brightness(brightness);
               call.set_transition_length(0);
               call.perform();
             }
           }
