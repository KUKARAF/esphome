substitutions:
  device_name: "BLE Proxy"
  friendly_name: "BLE Proxy"

esphome:
  name: ble-proxy
  friendly_name: "${friendly_name}"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_password

captive_portal:

api:
  encryption:
    key: !secret ble_proxy_api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

logger:
  hardware_uart: USB_SERIAL_JTAG

# Required by hass-omron (and any other BLE proxy use): active scanning,
# default scan interval, and the proxy itself always active so HA can make
# on-demand GATT connections (e.g. to poll the Omron BP monitor).
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
